<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普耕精舍 - 標籤印製法寶</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --zen-brown: #6d4c41; --zen-gold: #a68b5b; --zen-bg: #f9f7f2; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #efede8; margin: 0; padding: 10px; }
        
        /* 線上操作面板 */
        .container { max-width: 800px; margin: 20px auto; background: var(--zen-bg); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 2px solid var(--zen-gold); overflow: hidden; }
        .header { background: var(--zen-brown); color: #fff; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 4px; }
        
        .content { padding: 30px; }
        .step-title { display: block; font-size: 1.4rem; color: var(--zen-brown); font-weight: bold; margin-bottom: 15px; border-left: 5px solid var(--zen-gold); padding-left: 10px; }
        
        /* 大按鈕與大選單 */
        .file-box { border: 3px dashed var(--zen-gold); background: #fff; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; display: block; margin-bottom: 25px; transition: 0.3s; }
        .file-box:hover { background: #fffdf9; border-color: var(--zen-brown); }
        .file-box span { font-size: 1.3rem; color: #555; }
        
        .select-group { display: flex; gap: 20px; margin-bottom: 25px; }
        select { flex: 1; padding: 15px; font-size: 1.4rem; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
        
        .btn-print { background: var(--zen-brown); color: white; border: none; padding: 20px; width: 100%; font-size: 1.6rem; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(109, 76, 65, 0.4); }
        .btn-print:hover { background: #4e342e; transform: translateY(-2px); }

        /* A4 列印排版 (精確 2cm x 4cm) */
        #print-preview { 
            width: 210mm; background: white; margin: 30px auto; 
            padding: 10mm 5mm; display: grid; 
            grid-template-columns: repeat(5, 40mm); /* 寬4cm */
            grid-auto-rows: 20mm; /* 高2cm */
            box-sizing: border-box; border: 1px solid #999;
        }

        /* 標籤內容 - 字體加強版 */
        .label-card {
            width: 40mm; height: 20mm; border: 0.1mm solid #ddd;
            box-sizing: border-box; display: flex; flex-direction: column;
            padding: 1.5mm 2.5mm; overflow: hidden; position: relative;
        }
        .row-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .row-mid { flex-grow: 1; display: flex; align-items: center; justify-content: flex-end; margin-top: -2mm; }
        .row-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; }

        .text-cat { font-size: 9pt; color: #444; font-weight: normal; }
        .text-name { font-size: 19pt; font-weight: 900; color: #000; border-bottom: 1.5px solid #000; padding: 0 2px; }
        .text-evt { font-size: 9pt; color: #444; }
        .text-order { font-size: 15pt; font-weight: 900; color: #000; background: #eee; padding: 0 3px; border-radius: 3px; }

        @media print {
            body { padding: 0; background: white; }
            .container { display: none; }
            #print-preview { margin: 0; border: none; padding: 10mm 5mm; }
            .label-card { border: 0.1mm solid #eee; } /* 極淡切線 */
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>普耕精舍標籤印製法寶</h1>
        <p style="margin-top:10px; opacity:0.8; font-size: 1.1rem;">對事以真 · 隨機應變 · 圓滿成就</p>
    </div>
    
    <div class="content">
        <span class="step-title">第一步：啟請名單 (Excel 或 CSV)</span>
        <label class="file-box">
            <span id="file-status">點擊此處選擇檔案，或將檔案拖到這裡</span>
            <input type="file" id="input-file" accept=".xlsx, .xls, .csv" style="display:none;">
        </label>

        <div id="filter-section" style="display:none;">
            <span class="step-title">第二步：選擇類別與事件</span>
            <div class="select-group">
                <select id="sel-cat"><option value="">-- 選擇類別 --</option></select>
                <select id="sel-evt"><option value="">-- 選擇事件 --</option></select>
            </div>
        </div>

        <span class="step-title">第三步：圓滿印製</span>
        <button class="btn-print" onclick="window.print()">預覽並列印標籤</button>
        <p style="text-align: center; color: #888; margin-top: 15px;">(溫馨提示：列印時請將「邊距」設為「無」)</p>
    </div>
</div>

<div id="print-preview"></div>

<script>
    let rawData = [];
    const input = document.getElementById('input-file');
    const status = document.getElementById('file-status');

    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        status.innerText = "已載入：" + file.name;
        status.style.color = "#6d4c41";
        status.style.fontWeight = "bold";
        
        const reader = new FileReader();
        reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            initMenus();
            document.getElementById('filter-section').style.display = 'block';
        };
        reader.readAsArrayBuffer(file);
    };
